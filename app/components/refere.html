<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>themes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #f0ede8;
    --muted: rgba(240,237,232,0.4);
    --hint: rgba(240,237,232,0.2);
    --accent: #c9b8ff;
    --accent-bg: rgba(201,184,255,0.08);
    --accent-border: rgba(201,184,255,0.25);
    --radius-btn: 6px;
    --font-ui: 'Syne', sans-serif;
    --font-body: 'DM Mono', monospace;
    --font-display: 'Instrument Serif', serif;
    --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { height: 100%; }

  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    line-height: 1.6;
    transition: background var(--transition), color var(--transition);
  }

  /* noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 32px 80px;
  }

  header {
    margin-bottom: 56px;
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eyebrow::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 1px;
    background: var(--accent);
    opacity: 0.6;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(36px, 6vw, 52px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-bottom: 12px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }

  /* sections */
  .section {
    margin-bottom: 40px;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
  }

  .section-label {
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--hint);
    font-weight: 400;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* theme button — the star */
  .tb {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
    border-radius: var(--radius-btn);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: border-color var(--transition), color var(--transition), background var(--transition), transform 0.1s;
    white-space: nowrap;
    outline: none;
    position: relative;
    overflow: hidden;
  }

  .tb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity var(--transition);
  }

  .tb:hover {
    border-color: var(--border-hover);
    color: var(--text);
  }

  .tb:active { transform: scale(0.97); }

  .tb.active {
    border-color: var(--accent-border);
    background: var(--accent-bg);
    color: var(--text);
  }

  .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 48px 0;
  }

  /* preview panel */
  .preview-wrap {
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color var(--transition);
  }

  .preview-wrap:hover { border-color: var(--border-hover); }

  .preview-topbar {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }

  .traffic { width: 10px; height: 10px; border-radius: 50%; }

  .preview-body {
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .preview-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 400;
  }

  .preview-meta {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
  }

  .preview-line { height: 1px; background: var(--border); margin: 2px 0; }

  .preview-tags { display: flex; gap: 6px; flex-wrap: wrap; }

  .preview-tag {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--font-body);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .preview-tag.accent-tag {
    background: var(--accent-bg);
    border-color: var(--accent-border);
    color: var(--accent);
  }

  .preview-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: var(--radius-btn);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    background: var(--accent);
    color: var(--bg);
    border: none;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity var(--transition), transform 0.1s;
    align-self: flex-start;
  }

  .preview-cta:hover { opacity: 0.88; }
  .preview-cta:active { transform: scale(0.97); }

  /* current theme badge */
  .current-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 28px;
    transition: all var(--transition);
  }

  .badge-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }

  /* apply button */
  .apply-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 28px;
  }

  .apply-hint {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--hint);
  }

  .apply-btn {
    padding: 9px 22px;
    border-radius: var(--radius-btn);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    background: var(--accent);
    color: var(--bg);
    border: none;
    cursor: pointer;
    transition: opacity var(--transition), transform 0.1s;
  }

  .apply-btn:hover { opacity: 0.85; }
  .apply-btn:active { transform: scale(0.97); }

  /* toast */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: var(--bg);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 999px;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    white-space: nowrap;
    z-index: 100;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* keyframes */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .page > * {
    animation: fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) both;
  }

  header                { animation-delay: 0.05s; }
  .section:nth-child(2) { animation-delay: 0.10s; }
  .section:nth-child(3) { animation-delay: 0.15s; }
  .section:nth-child(4) { animation-delay: 0.18s; }
  .section:nth-child(5) { animation-delay: 0.21s; }
  .divider              { animation-delay: 0.23s; }
  .preview-section      { animation-delay: 0.28s; }
</style>
</head>
<body>

<div class="page">

  <header>
    <div class="eyebrow">appearance</div>
    <h1>pick your <em>theme.</em></h1>
    <p class="subtitle">// changes apply instantly across the interface</p>
  </header>

  <!-- base -->
  <div class="section">
    <div class="section-header">
      <span class="section-label">base</span>
      <div class="section-line"></div>
    </div>
    <div class="btn-row" id="base-row">
      <button class="tb active" data-val="dark" onclick="pick('base',this)"><span class="swatch" style="background:#111"></span>dark</button>
      <button class="tb" data-val="light" onclick="pick('base',this)"><span class="swatch" style="background:#f5f5f0;border-color:#ccc"></span>light</button>
      <button class="tb" data-val="dim" onclick="pick('base',this)"><span class="swatch" style="background:#2e3440"></span>dim</button>
      <button class="tb" data-val="sepia" onclick="pick('base',this)"><span class="swatch" style="background:#f4eed8;border-color:#d8cdb0"></span>sepia</button>
      <button class="tb" data-val="midnight" onclick="pick('base',this)"><span class="swatch" style="background:#060a14"></span>midnight</button>
      <button class="tb" data-val="forest" onclick="pick('base',this)"><span class="swatch" style="background:#0f1a12"></span>forest</button>
    </div>
  </div>

  <!-- accent -->
  <div class="section">
    <div class="section-header">
      <span class="section-label">accent</span>
      <div class="section-line"></div>
    </div>
    <div class="btn-row" id="accent-row">
      <button class="tb active" data-val="purple" onclick="pick('accent',this)"><span class="swatch" style="background:#c9b8ff"></span>purple</button>
      <button class="tb" data-val="teal" onclick="pick('accent',this)"><span class="swatch" style="background:#3dd6ab"></span>teal</button>
      <button class="tb" data-val="coral" onclick="pick('accent',this)"><span class="swatch" style="background:#ff7b5c"></span>coral</button>
      <button class="tb" data-val="sky" onclick="pick('accent',this)"><span class="swatch" style="background:#60b4f6"></span>sky</button>
      <button class="tb" data-val="gold" onclick="pick('accent',this)"><span class="swatch" style="background:#f5c842"></span>gold</button>
      <button class="tb" data-val="pink" onclick="pick('accent',this)"><span class="swatch" style="background:#f48fb1"></span>pink</button>
      <button class="tb" data-val="lime" onclick="pick('accent',this)"><span class="swatch" style="background:#b5e853"></span>lime</button>
      <button class="tb" data-val="white" onclick="pick('accent',this)"><span class="swatch" style="background:#f0ede8;border-color:#bbb"></span>white</button>
    </div>
  </div>

  <!-- radius -->
  <div class="section">
    <div class="section-header">
      <span class="section-label">radius</span>
      <div class="section-line"></div>
    </div>
    <div class="btn-row" id="radius-row">
      <button class="tb" data-val="0px" onclick="pick('radius',this)">sharp</button>
      <button class="tb active" data-val="6px" onclick="pick('radius',this)">soft</button>
      <button class="tb" data-val="12px" onclick="pick('radius',this)">rounded</button>
      <button class="tb" data-val="999px" onclick="pick('radius',this)">pill</button>
    </div>
  </div>

  <!-- font -->
  <div class="section">
    <div class="section-header">
      <span class="section-label">typeface</span>
      <div class="section-line"></div>
    </div>
    <div class="btn-row" id="font-row">
      <button class="tb active" data-val="syne" onclick="pick('font',this)">syne</button>
      <button class="tb" data-val="mono" onclick="pick('font',this)" style="font-family:'DM Mono',monospace">mono</button>
      <button class="tb" data-val="serif" onclick="pick('font',this)" style="font-family:'Instrument Serif',serif;font-style:italic;font-size:14px">serif</button>
      <button class="tb" data-val="system" onclick="pick('font',this)" style="font-family:system-ui">system</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- preview -->
  <div class="preview-section">
    <div class="current-badge" id="badge">
      <span class="badge-dot" id="bdot"></span>
      <span id="badge-text">dark · purple · soft · syne</span>
    </div>

    <div class="preview-wrap" id="preview">
      <div class="preview-topbar" id="ptb">
        <div class="traffic" style="background:#ff5f57"></div>
        <div class="traffic" style="background:#febc2e"></div>
        <div class="traffic" style="background:#28c840"></div>
      </div>
      <div class="preview-body" id="pbody">
        <div class="preview-meta" id="pmeta">article · may 2026</div>
        <div class="preview-title" id="ptitle">how themes shape perception</div>
        <div class="preview-line" id="pline"></div>
        <div class="preview-tags" id="ptags">
          <span class="preview-tag accent-tag" id="ptag-main">design</span>
          <span class="preview-tag" id="ptag2">ui</span>
          <span class="preview-tag" id="ptag3">color</span>
        </div>
        <button class="preview-cta" id="pcta">read more →</button>
      </div>
    </div>

    <div class="apply-row">
      <span class="apply-hint">// theme is live — no save needed</span>
      <button class="apply-btn" id="apply-btn" onclick="applyTheme()">apply theme</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">theme applied</div>

<script>
const bases = {
  dark:     { bg:'#0e0e0f', surface:'#161618', border:'rgba(255,255,255,0.07)', bh:'rgba(255,255,255,0.15)', text:'#f0ede8', muted:'rgba(240,237,232,0.4)', hint:'rgba(240,237,232,0.2)' },
  light:    { bg:'#f5f5f0', surface:'#ffffff',  border:'rgba(0,0,0,0.08)',       bh:'rgba(0,0,0,0.18)',      text:'#1a1a1a', muted:'rgba(26,26,26,0.45)',     hint:'rgba(26,26,26,0.22)' },
  dim:      { bg:'#1e2433', surface:'#252d3d',  border:'rgba(255,255,255,0.08)', bh:'rgba(255,255,255,0.16)',text:'#cdd6f4', muted:'rgba(205,214,244,0.45)',   hint:'rgba(205,214,244,0.22)' },
  sepia:    { bg:'#f4eed8', surface:'#ebe3c5',  border:'rgba(80,50,20,0.12)',    bh:'rgba(80,50,20,0.22)',   text:'#3a2a1a', muted:'rgba(58,42,26,0.45)',      hint:'rgba(58,42,26,0.22)' },
  midnight: { bg:'#060a14', surface:'#0d1321',  border:'rgba(255,255,255,0.06)', bh:'rgba(255,255,255,0.13)',text:'#e8eaf6', muted:'rgba(232,234,246,0.4)',    hint:'rgba(232,234,246,0.18)' },
  forest:   { bg:'#0f1a12', surface:'#162019',  border:'rgba(255,255,255,0.07)', bh:'rgba(255,255,255,0.14)',text:'#d4eddb', muted:'rgba(212,237,219,0.45)',   hint:'rgba(212,237,219,0.2)' },
};

const accents = {
  purple: { main:'#c9b8ff', bg:'rgba(201,184,255,0.08)', border:'rgba(201,184,255,0.25)' },
  teal:   { main:'#3dd6ab', bg:'rgba(61,214,171,0.08)',  border:'rgba(61,214,171,0.25)' },
  coral:  { main:'#ff7b5c', bg:'rgba(255,123,92,0.08)',  border:'rgba(255,123,92,0.25)' },
  sky:    { main:'#60b4f6', bg:'rgba(96,180,246,0.08)',  border:'rgba(96,180,246,0.25)' },
  gold:   { main:'#f5c842', bg:'rgba(245,200,66,0.08)',  border:'rgba(245,200,66,0.25)' },
  pink:   { main:'#f48fb1', bg:'rgba(244,143,177,0.08)', border:'rgba(244,143,177,0.25)' },
  lime:   { main:'#b5e853', bg:'rgba(181,232,83,0.08)',  border:'rgba(181,232,83,0.25)' },
  white:  { main:'#f0ede8', bg:'rgba(240,237,232,0.08)', border:'rgba(240,237,232,0.25)' },
};

const fonts = {
  syne:   "'Syne', sans-serif",
  mono:   "'DM Mono', monospace",
  serif:  "'Instrument Serif', serif",
  system: "system-ui, -apple-system, sans-serif",
};

let state = { base:'dark', accent:'purple', radius:'6px', font:'syne' };

function setActive(rowId, btn) {
  document.getElementById(rowId).querySelectorAll('.tb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function pick(type, btn) {
  const rowMap = { base:'base-row', accent:'accent-row', radius:'radius-row', font:'font-row' };
  state[type] = btn.dataset.val;
  setActive(rowMap[type], btn);
  render();
}

function render() {
  const b = bases[state.base];
  const a = accents[state.accent];
  const r = state.radius;
  const f = fonts[state.font];

  const root = document.documentElement;
  root.style.setProperty('--bg', b.bg);
  root.style.setProperty('--surface', b.surface);
  root.style.setProperty('--border', b.border);
  root.style.setProperty('--border-hover', b.bh);
  root.style.setProperty('--text', b.text);
  root.style.setProperty('--muted', b.muted);
  root.style.setProperty('--hint', b.hint);
  root.style.setProperty('--accent', a.main);
  root.style.setProperty('--accent-bg', a.bg);
  root.style.setProperty('--accent-border', a.border);
  root.style.setProperty('--radius-btn', r);
  root.style.setProperty('--font-ui', f);

  const previewR = r === '999px' ? '14px' : r;
  const preview = document.getElementById('preview');
  preview.style.borderRadius = previewR;

  document.getElementById('ptb').style.background = b.surface;
  document.getElementById('ptb').style.borderColor = b.border;
  document.getElementById('pbody').style.background = b.bg;
  document.getElementById('pmeta').style.color = b.muted;
  document.getElementById('ptitle').style.color = b.text;
  document.getElementById('pline').style.background = b.border;
  document.getElementById('ptag2').style.color = b.muted;
  document.getElementById('ptag2').style.borderColor = b.border;
  document.getElementById('ptag3').style.color = b.muted;
  document.getElementById('ptag3').style.borderColor = b.border;

  const cta = document.getElementById('pcta');
  cta.style.background = a.main;
  cta.style.borderRadius = r === '999px' ? '999px' : r === '0px' ? '0' : '8px';

  const isDark = ['dark','dim','midnight','forest'].includes(state.base);
  cta.style.color = isDark ? '#0e0e0f' : (a.main === '#f0ede8' ? '#1a1a1a' : '#0e0e0f');

  document.getElementById('bdot').style.background = a.main;
  document.getElementById('badge-text').textContent = `${state.base} · ${state.accent} · ${r === '0px' ? 'sharp' : r === '6px' ? 'soft' : r === '12px' ? 'rounded' : 'pill'} · ${state.font}`;

  document.getElementById('apply-btn').style.borderRadius = r === '999px' ? '999px' : r === '0px' ? '0' : '6px';
}

function applyTheme() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

render();
</script>
</body>
</html>
